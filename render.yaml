# Render blueprint: Postgres + API + web (SPEC.md section 13).
# Render > New > Blueprint > pick this repo. It asks for the values marked sync: false.
databases:
  - name: calma-db
    plan: free          # Render's free Postgres expires after 30 days; upgrade or move to Neon for real use
    databaseName: calma
    user: calma
    postgresMajorVersion: "16"

services:
  - type: web
    name: calma-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: calma-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY       # Fernet key - generate locally (see DEPLOY.md) and keep a copy
        sync: false
      - key: CORS_ORIGINS         # the web URL, e.g. https://calma-web.onrender.com
        sync: false
      - key: WEB_URL              # same as CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: calma-web
    runtime: docker
    rootDir: web
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_API_URL  # the API URL, e.g. https://calma-api.onrender.com (used at build time)
        sync: false
